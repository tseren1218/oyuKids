[project]
name = "oyukids"
version = "0.1.0"
description = "oyuKids — kids improvement platform (reading speed, word & poem memorization)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
singlestore = ["singlestoredb>=1.7"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*.html", "static/**/*", "db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
